<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodePage</title>
<link rel="stylesheet" href="builder.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-undo" viewBox="0 0 16 16"><path d="M5.8 3.6 2.6 6.8 5.8 10"/><path d="M2.9 6.8h6.6a3.6 3.6 0 0 1 0 7.2H7.6"/></symbol>
    <symbol id="i-redo" viewBox="0 0 16 16"><path d="M10.2 3.6 13.4 6.8 10.2 10"/><path d="M13.1 6.8H6.5a3.6 3.6 0 0 0 0 7.2h1.9"/></symbol>
    <symbol id="i-code" viewBox="0 0 16 16"><path d="m5.4 4.6-3.4 3.4 3.4 3.4"/><path d="m10.6 4.6 3.4 3.4-3.4 3.4"/><path d="m9 2.8-2 10.4"/></symbol>
    <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1.6 8S4 3.7 8 3.7 14.4 8 14.4 8 12 12.3 8 12.3 1.6 8 1.6 8Z"/><circle cx="8" cy="8" r="2"/></symbol>
    <symbol id="i-folder" viewBox="0 0 16 16"><path d="M1.8 4.4c0-.6.4-1 1-1h3.1l1.5 1.5h5.8c.6 0 1 .4 1 1v6.2c0 .6-.4 1-1 1H2.8c-.6 0-1-.4-1-1Z"/></symbol>
    <symbol id="i-save" viewBox="0 0 16 16"><path d="M2.6 3.6c0-.6.4-1 1-1h7l2.8 2.8v7c0 .6-.4 1-1 1H3.6c-.6 0-1-.4-1-1Z"/><path d="M5.2 2.7v2.8h4.6V2.7"/><path d="M5 13.3V9.6h6v3.7"/></symbol>
    <symbol id="i-export" viewBox="0 0 16 16"><path d="M8 10V2.6"/><path d="M5.2 5.3 8 2.5l2.8 2.8"/><path d="M2.6 9.6v2.8c0 .6.4 1 1 1h8.8c.6 0 1-.4 1-1V9.6"/></symbol>
    <symbol id="i-desktop" viewBox="0 0 16 16"><rect x="1.6" y="2.6" width="12.8" height="8.4" rx="1.2"/><path d="M5.6 13.4h4.8M8 11v2.4"/></symbol>
    <symbol id="i-tablet" viewBox="0 0 16 16"><rect x="3.1" y="1.6" width="9.8" height="12.8" rx="1.6"/><path d="M7.1 12.2h1.8"/></symbol>
    <symbol id="i-phone" viewBox="0 0 16 16"><rect x="4.6" y="1.6" width="6.8" height="12.8" rx="1.6"/><path d="M7.3 12.2h1.4"/></symbol>
    <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.4"/><path d="m10.3 10.3 3.3 3.3"/></symbol>
    <symbol id="i-blocks" viewBox="0 0 16 16"><rect x="2.2" y="2.2" width="4.8" height="4.8" rx="1"/><rect x="9" y="2.2" width="4.8" height="4.8" rx="1"/><rect x="2.2" y="9" width="4.8" height="4.8" rx="1"/><path d="M11.4 9v4.8M9 11.4h4.8"/></symbol>
    <symbol id="i-layers" viewBox="0 0 16 16"><path d="m8 2.2 5.8 3.1L8 8.4 2.2 5.3Z"/><path d="m2.2 8.1 5.8 3.1 5.8-3.1"/><path d="m2.2 10.9 5.8 3.1 5.8-3.1"/></symbol>
    <symbol id="i-palette" viewBox="0 0 16 16"><path d="M8 1.9a6.1 6.1 0 1 0 0 12.2c.9 0 1.4-.6 1.4-1.3 0-.9-.8-1.2-.8-2 0-.7.6-1.2 1.3-1.2h1.6a2.6 2.6 0 0 0 2.6-2.6c0-2.8-2.7-5.1-6.1-5.1Z"/><circle cx="5.1" cy="7.3" r=".8"/><circle cx="7.6" cy="4.9" r=".8"/><circle cx="10.5" cy="5.7" r=".8"/></symbol>
    <symbol id="i-template" viewBox="0 0 16 16"><rect x="2.2" y="2.2" width="11.6" height="11.6" rx="1.4"/><path d="M2.2 6h11.6M6.4 6v7.8"/></symbol>
    <symbol id="i-up" viewBox="0 0 16 16"><path d="M8 12.8V3.4M4.3 7 8 3.3 11.7 7"/></symbol>
    <symbol id="i-down" viewBox="0 0 16 16"><path d="M8 3.2v9.4M4.3 9 8 12.7 11.7 9"/></symbol>
    <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5.4" y="5.4" width="8" height="8" rx="1.3"/><path d="M10.6 3.3a.8.8 0 0 0-.8-.7H3.4a.8.8 0 0 0-.8.8v6.4c0 .4.3.8.7.8"/></symbol>
    <symbol id="i-trash" viewBox="0 0 16 16"><path d="M2.6 4.4h10.8M6.4 2.5h3.2M4 4.4l.7 8.3c0 .5.5.8 1 .8h4.6c.5 0 1-.3 1-.8l.7-8.3"/></symbol>
    <symbol id="i-close" viewBox="0 0 16 16"><path d="m4.2 4.2 7.6 7.6M11.8 4.2l-7.6 7.6"/></symbol>
    <symbol id="i-image" viewBox="0 0 16 16"><rect x="2" y="2.6" width="12" height="10.8" rx="1.4"/><circle cx="5.8" cy="6.2" r="1.1"/><path d="m2.4 12 3.6-3.3 2.4 2.1 2-1.7 3.2 2.8"/></symbol>
    <symbol id="i-check" viewBox="0 0 16 16"><path d="m3.6 8.3 2.8 2.8 6-6.3"/></symbol>
    <symbol id="i-chev" viewBox="0 0 16 16"><path d="m4.6 6.2 3.4 3.4 3.4-3.4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3.2v9.6M3.2 8h9.6"/></symbol>
    <symbol id="i-al-left" viewBox="0 0 16 16"><path d="M2.6 3.6h10.8M2.6 6.5h6.6M2.6 9.4h10.8M2.6 12.3h6.6"/></symbol>
    <symbol id="i-al-center" viewBox="0 0 16 16"><path d="M2.6 3.6h10.8M4.7 6.5h6.6M2.6 9.4h10.8M4.7 12.3h6.6"/></symbol>
    <symbol id="i-al-right" viewBox="0 0 16 16"><path d="M2.6 3.6h10.8M6.8 6.5h6.6M2.6 9.4h10.8M6.8 12.3h6.6"/></symbol>
    <symbol id="i-al-auto" viewBox="0 0 16 16"><rect x="2.6" y="3.2" width="10.8" height="9.6" rx="1.4" stroke-dasharray="2.2 1.8"/></symbol>
    <symbol id="i-backend" viewBox="0 0 16 16"><ellipse cx="8" cy="3.9" rx="4.9" ry="1.8"/><path d="M3.1 3.9v8.2c0 1 2.2 1.8 4.9 1.8s4.9-.8 4.9-1.8V3.9"/><path d="M3.1 8c0 1 2.2 1.8 4.9 1.8S12.9 9 12.9 8"/></symbol>
    <symbol id="i-grip" viewBox="0 0 16 16"><circle cx="6" cy="4" r=".9"/><circle cx="10" cy="4" r=".9"/><circle cx="6" cy="8" r=".9"/><circle cx="10" cy="8" r=".9"/><circle cx="6" cy="12" r=".9"/><circle cx="10" cy="12" r=".9"/></symbol>
  </defs>
</svg>

<header class="bar">
  <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><span>CodePage</span></div>
  <span class="rule"></span>
  <input id="pageTitle" class="title" aria-label="网页标题" placeholder="网页标题" spellcheck="false">
  <span id="saved" class="saved" aria-live="polite"></span>
  <span class="grow"></span>
  <div class="seg" role="group" aria-label="屏幕宽度">
    <button data-width="100%" data-name="电脑" class="on" title="电脑"><svg><use href="#i-desktop"/></svg></button>
    <button data-width="768px" data-name="平板" title="平板 · 768"><svg><use href="#i-tablet"/></svg></button>
    <button data-width="390px" data-name="手机" title="手机 · 390"><svg><use href="#i-phone"/></svg></button>
  </div>
  <span class="grow"></span>
  <button id="drawerRight" class="icon only-thin" title="属性" aria-label="属性"><svg><use href="#i-palette"/></svg></button>
  <button id="undo" class="icon" title="撤销 · Ctrl+Z" aria-label="撤销"><svg><use href="#i-undo"/></svg></button>
  <button id="redo" class="icon" title="重做 · Ctrl+Y" aria-label="重做"><svg><use href="#i-redo"/></svg></button>
  <span class="rule"></span>
  <button id="showCode" class="ghost" title="看生成的代码"><svg><use href="#i-code"/></svg><span>代码</span></button>
  <button id="preview" class="ghost" title="在新窗口里看"><svg><use href="#i-eye"/></svg><span>预览</span></button>
  <button id="open" class="ghost" title="打开 page.json"><svg><use href="#i-folder"/></svg><span>打开</span></button>
  <button id="save" class="ghost" title="保存 · Ctrl+S"><svg><use href="#i-save"/></svg><span>保存</span></button>
  <button id="backend" class="ghost" title="把页面里要后端处理的表单、按钮和链接整理成需求，交给 AI 写后端"><svg><use href="#i-backend"/></svg><span>写后端</span></button>
  <button id="export" class="primary"><svg><use href="#i-export"/></svg><span>导出网页</span></button>
</header>

<main class="work">
  <nav class="rail" aria-label="左栏">
    <button class="on" data-tab="parts" title="组件"><svg><use href="#i-blocks"/></svg><span>组件</span></button>
    <button data-tab="starts" title="模板"><svg><use href="#i-template"/></svg><span>模板</span></button>
    <button data-tab="layers" title="层级"><svg><use href="#i-layers"/></svg><span>层级</span></button>
    <button data-tab="design" title="外观"><svg><use href="#i-palette"/></svg><span>外观</span></button>
  </nav>
  <aside class="left">
    <div class="paneHead"><strong id="paneTitle">组件</strong><span id="paneNote" class="note"></span></div>
    <label class="find" id="findBox"><svg><use href="#i-search"/></svg><input id="find" placeholder="找组件，比如 首屏、价格、幻灯片" aria-label="找组件" spellcheck="false" autocomplete="off"><kbd>/</kbd></label>
    <div id="partsFilter" class="filters"></div>
    <div id="parts" class="pane"></div>
    <div id="starts" class="pane" hidden></div>
    <div id="layers" class="pane" hidden></div>
    <div id="design" class="pane" hidden></div>
  </aside>
  <section class="middle" id="middle">
    <div class="stage" id="stage">
      <div class="stageHead"><span class="dot"></span><span id="stageSize">电脑</span><span class="grow"></span><span id="stageCount" class="note"></span></div>
      <iframe id="canvas" title="画布"></iframe>
    </div>
  </section>
  <aside class="right" id="right"></aside>
</main>

<div id="ghost" class="ghost-card" hidden></div>
<div id="shield" class="shield" hidden></div>
<dialog id="codeBox" class="sheet">
  <div class="sheetHead"><strong>生成的代码</strong><span id="codeSize" class="note"></span><span class="grow"></span><button id="copyCode" class="ghost"><svg><use href="#i-copy"/></svg><span>复制</span></button><button id="closeCode" class="icon" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
  <pre id="codeText" tabindex="-1"></pre>
</dialog>
<dialog id="backendBox" class="sheet">
  <div class="sheetHead"><strong>交给 AI 写后端</strong><span class="note">页面里要后端处理的地方</span><span class="grow"></span><button id="closeBackend" class="icon" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
  <div class="sheetBody" id="backendBody"></div>
  <div class="sheetFoot"><span id="backendWhere" class="note"></span><span class="grow"></span><button id="copyBackend" class="ghost"><svg><use href="#i-copy"/></svg><span>复制需求</span></button><button id="sendBackend" class="primary"><span>交给 Lumen</span></button></div>
</dialog>
<dialog id="askBox" class="sheet" style="width:min(420px,92vw)">
  <div class="sheetHead"><strong id="askText"></strong></div>
  <div class="sheetFoot"><span class="grow"></span><button id="askNo" class="ghost"><span>取消</span></button><button id="askYes" class="primary"><span>好</span></button></div>
</dialog>
<input type="file" id="pickJson" accept=".json" hidden>
<input type="file" id="pickImage" accept="image/*" hidden>
<div id="toast" class="toast" hidden></div>
<script>if (window.qt) document.write('<script src="qrc:///qtwebchannel/qwebchannel.js"><\/script>');</script>
<script src="components.js"></script>
<script src="render.js"></script>
<script src="builder.js"></script>
</body>
</html>
